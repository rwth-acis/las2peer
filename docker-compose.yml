# Full local las2peer stack: Ethereum dev chain (anvil) -> registry contracts -> las2peer node.
#   docker compose up -d --build     (first start builds everything from source)
#   open http://localhost:${LAS2PEER_HTTP_PORT:-8080}/las2peer/webapp/welcome
# Everything is ephemeral: `docker compose down` gives you a fresh chain and network next time.
name: las2peer

services:
  chain:
    image: ghcr.io/foundry-rs/foundry:v1.8.5
    entrypoint: ["anvil"]
    # dev accounts are funded by the contracts deployer (anvil_setBalance)
    command: ["--host", "0.0.0.0", "--chain-id", "456719", "--silent"]
    ports:
      - "${ETH_RPC_PORT:-8545}:8545"

  contracts:
    # set CONTRACTS_CONTEXT=../las2peer-registry-contracts to build from a local checkout
    build: ${CONTRACTS_CONTEXT:-https://github.com/rwth-acis/las2peer-registry-contracts.git#revival}
    environment:
      ETH_HOST: chain
      REGISTRY_CONFIG: /config/registry.properties
    volumes:
      - registry-config:/config
    depends_on:
      - chain

  node:
    build: .
    depends_on:
      contracts:
        condition: service_completed_successfully
    environment:
      LAS2PEER_ETH_MNEMONIC: differ employ cook sport clinic wedding melody column pave stuff oak price
      REGISTRY_CONFIG: /config/registry.properties
      NODE_ID_SEED: "1"
      NODE_ADMIN_NAME: ${NODE_ADMIN_NAME:-admin}
      NODE_ADMIN_EMAIL: ${NODE_ADMIN_EMAIL:-admin@example.org}
      NODE_DESCRIPTION: Local las2peer development node with the Ethereum registry.
    volumes:
      - registry-config:/config:ro
      - ./services:/app/service
    ports:
      - "${LAS2PEER_HTTP_PORT:-8080}:8080"
      - "${LAS2PEER_P2P_PORT:-9011}:9011"
      - "${LAS2PEER_P2P_PORT:-9011}:9011/udp"
    # the launcher ends with an interactive console; `docker attach las2peer-node-1` to use it
    stdin_open: true
    tty: true

volumes:
  registry-config:
