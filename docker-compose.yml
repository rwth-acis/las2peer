# Full local las2peer stack: Ethereum dev chain -> registry contracts -> las2peer node.
#   docker compose up -d --build     (first start builds everything from source)
#   open http://localhost:${LAS2PEER_HTTP_PORT:-8080}/las2peer/webapp/welcome
# Everything is ephemeral: `docker compose down` gives you a fresh chain and network next time.
name: las2peer

services:
  ganache:
    image: trufflesuite/ganache:v7.9.2
    command:
      - --server.host=0.0.0.0
      - --chain.networkId=456719
      - --chain.chainId=456719
      # pre-EIP-1559 so truffle 5.0 and web3j 4.5 work unchanged
      - --chain.hardfork=istanbul
      - --miner.blockGasLimit=6721975
      - --logging.quiet
      # Dev-only funded accounts: the keys las2peer derives from the 10 dev mnemonics
      # (see dev/node.sh). Never use them anywhere real.
      - --wallet.accounts=0x95395d5cd006cf4a95a01f219a66205d4b7d02e54b0da326e9154fa618f083fa,0xD3C21BCECCEDA1000000
      - --wallet.accounts=0xaae2ed23109633f821c9bd39cfd2d7de2ff6dd49796663a30b3eb5b6880c63db,0xD3C21BCECCEDA1000000
      - --wallet.accounts=0xe5c65369fb1021efbc6f1317da46407ba87bf510611457e25dde4eca7c8e80d3,0xD3C21BCECCEDA1000000
      - --wallet.accounts=0x3ad62eea7750b111613227e78620054b85f290f93b8fd6284fef44d974fc5f91,0xD3C21BCECCEDA1000000
      - --wallet.accounts=0xbc2f0a9bc4628f12aa5a8fc697b2f43ffed83da0496b881fa81d45a86909b1df,0xD3C21BCECCEDA1000000
      - --wallet.accounts=0x3bbd32652e6e86c6f7c6e4e3bdd950afaa83d274c097c28a509dcd9569051787,0xD3C21BCECCEDA1000000
      - --wallet.accounts=0xbe1c179fbfd7ad41bcee685d56d13bcc6dd555ac2bb5a97e095adc75b9397441,0xD3C21BCECCEDA1000000
      - --wallet.accounts=0x8318fa509f77c65fb233d2f143dc7276fe2cf3d8538ad15ed31b14e87b39222c,0xD3C21BCECCEDA1000000
      - --wallet.accounts=0xf14be57edb9e8ebe272e0f4875ae3737217273657307116a459ccc30abae25b1,0xD3C21BCECCEDA1000000
      - --wallet.accounts=0xea9350dc7c1a7cff22832576d555590ea32f83e3fcccd2e55b74475075117481,0xD3C21BCECCEDA1000000
    ports:
      - "${ETH_RPC_PORT:-8545}:8545"

  contracts:
    # set CONTRACTS_CONTEXT=../las2peer-registry-contracts to build from a local checkout
    build: ${CONTRACTS_CONTEXT:-https://github.com/rwth-acis/las2peer-registry-contracts.git#revival}
    environment:
      ETH_HOST: ganache
      REGISTRY_CONFIG: /config/registry.properties
    volumes:
      - registry-config:/config
    depends_on:
      - ganache

  node:
    build: .
    depends_on:
      contracts:
        condition: service_completed_successfully
    environment:
      LAS2PEER_ETH_MNEMONIC: differ employ cook sport clinic wedding melody column pave stuff oak price
      REGISTRY_CONFIG: /config/registry.properties
      NODE_ID_SEED: "1"
      NODE_ADMIN_NAME: ${NODE_ADMIN_NAME:-admin}
      NODE_ADMIN_EMAIL: ${NODE_ADMIN_EMAIL:-admin@example.org}
      NODE_DESCRIPTION: Local las2peer development node with the Ethereum registry.
    volumes:
      - registry-config:/config:ro
      - ./services:/app/service
    ports:
      - "${LAS2PEER_HTTP_PORT:-8080}:8080"
      - "${LAS2PEER_P2P_PORT:-9011}:9011"
      - "${LAS2PEER_P2P_PORT:-9011}:9011/udp"
    # the launcher ends with an interactive console; `docker attach las2peer-node-1` to use it
    stdin_open: true
    tty: true

volumes:
  registry-config:
